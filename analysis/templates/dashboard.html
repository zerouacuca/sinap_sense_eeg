{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">
                    <h3>Filtros</h3>
                </div>
                <div class="card-body">
                    <form method="post" id="filter-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="event" class="form-label">Evento</label>
                            <select name="event" id="event" class="form-select">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="start_time" class="form-label">Início (HH:MM:SS)</label>
                            <input type="text" name="start_time" id="start_time" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="end_time" class="form-label">Fim (HH:MM:SS)</label>
                            <input type="text" name="end_time" id="end_time" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary">Aplicar Filtro</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card">
                <div class="card-header">
                    <h3>Dashboard de Análise de EEG</h3>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            {{ power_plot|safe }}
                        </div>
                        <div class="col-md-6">
                            {{ topomap_plot|safe }}
                        </div>
                    </div>
                    <div class="row mt-4">
                        <div class="col-md-12">
                            {{ brain_waves_plot|safe }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch("{% url 'analysis:get_events' eeg_data.id %}")
            .then(response => response.json())
            .then(data => {
                const eventSelect = document.getElementById('event');
                data.events.forEach(event => {
                    const option = document.createElement('option');
                    option.value = event;
                    option.textContent = event;
                    eventSelect.appendChild(option);
                });
            });
    });
</script>
{% endblock %}
